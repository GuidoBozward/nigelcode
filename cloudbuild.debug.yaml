steps:
# Show workspace contents for debugging
- name: "gcr.io/cloud-builders/docker"
  entrypoint: "sh"
  args:
  - -c
  - |
    echo "--- ls -la /workspace ---"
    ls -la /workspace || true
    echo "--- ls -la . ---"
    ls -la . || true

# Try common Dockerfile locations and build using the first one found
- name: "gcr.io/cloud-builders/docker"
  entrypoint: "sh"
  args:
  - -c
  - |
    set -e
    for f in Dockerfile ./Dockerfile myNigelcode/Dockerfile ./myNigelcode/Dockerfile; do
      if [ -f "$f" ]; then
        echo "Found Dockerfile at: $f"
        docker build -t gcr.io/$PROJECT_ID/mynigelcode -f "$f" .
        exit 0
      else
        echo "Not found: $f"
      fi
    done
    echo "No Dockerfile found in attempted locations. Listing /workspace for inspection:"
    ls -la /workspace
    exit 1

images:
- "gcr.io/$PROJECT_ID/mynigelcode"
